name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every commit for secrets
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --report-format json --report-path /tmp/gitleaks-report.json --log-opts="--all"
          status=$?
          if [ -f /tmp/gitleaks-report.json ]; then cat /tmp/gitleaks-report.json; fi
          exit $status
