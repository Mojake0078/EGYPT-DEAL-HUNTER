name: dependency-safe-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stock-status-and-matching
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current lockfile
        run: npm ci --ignore-scripts --no-fund
      - name: Apply non-breaking dependency fixes only
        run: npm audit fix --no-fund
      - name: Print remaining audit summary
        run: |
          npm audit --json > npm-audit-after.json || true
          node -e "const r=require('./npm-audit-after.json'); console.log('REMAINING_VULNERABILITIES', JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(r.vulnerabilities ?? {})) console.log(name, v.severity, 'direct='+v.isDirect, 'fix='+JSON.stringify(v.fixAvailable));"
      - name: Validate updated lockfile
        run: |
          npm ci --ignore-scripts --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit lockfile-only security updates
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No semver-compatible lockfile updates were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: apply non-breaking dependency security updates"
          git push origin HEAD:fix/stock-status-and-matching
