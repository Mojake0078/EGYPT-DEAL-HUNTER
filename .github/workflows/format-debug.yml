name: format-debug

on:
  push:
    branches:
      - fix/stock-status-and-matching

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print canonical formatting
        run: |
          npx prettier --write apps/checker/src/infrastructure/grpc-scraper-client.ts libs/contracts/src/scraper.ts
          echo '--- grpc-scraper-client.ts ---'
          cat apps/checker/src/infrastructure/grpc-scraper-client.ts
          echo '--- scraper.ts ---'
          cat libs/contracts/src/scraper.ts
